[package]
name = "ap"
version = "1.0.0"
edition = "2024"
description = "ap"
authors = ["Daniele Falchetti <danielefalche@gmail.com>"]
license = "MIT"
repository = "https://github.com/falcosan/ap"

[dependencies]
htmd = "0.5"
axum = "0.8"
serde_json = "1"
serde = "1.0.229"
chrono = "0.4.45"
dotenvy = "0.15.7"
tracing = "0.1.44"
tower-layer = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = [
  "fs",
  "normalize-path",
  "compression-gzip",
  "compression-br",
] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "gzip",
  "http2",
  "rustls",
  "brotli",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
minijinja = { version = "3", features = ["serde", "speedups", "json"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
